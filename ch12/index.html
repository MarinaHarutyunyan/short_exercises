<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete a Form</title>
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
<h1>Please complete our survey</h1>
<form action="confirmation.html" method="post">
    
    <fieldset>
        <legend>Contact information</legend>
        
        <label for="email">Email address:</label>
        <input type="email" name="email" id="email" required autofocus accesskey="e">
        
        <label for="first_name">First name:</label>
        <input type="text" name="first_name" id="first_name" required accesskey="f">
        
        <label for="last_name">Last name:</label>
        <input type="text" name="last_name" id="last_name" required accesskey="l">
    </fieldset>

    <fieldset>
        <legend>Geographic information</legend>
        
        <label for="state">State:</label>
        <input type="text" name="state" id="state" required placeholder="Two characters" pattern="^[A-Za-z]{2}$">
        
        <label for="zip_code">Zip code:</label>
        <input type="text" name="zip_code" id="zip_code" required placeholder="Five digits" pattern="^\d{5}$">
    </fieldset>

    <fieldset>
        <legend>Source</legend>
        
        <label for="hear">How did you hear about us?</label>
        <select name="hear" id="hear">
            <option value="web">Web Search</option>
            <option value="friend">From a Friend</option>
            <option value="ad">Advertisement</option>
            <option value="other">Other</option>
        </select>
        
        <label for="comments">Additional comments:</label>
        <textarea name="comments" id="comments" rows="4"></textarea>
    </fieldset>

    <div class="buttons">
        <button type="submit" class="btn btn-submit" accesskey="s">Submit</button>
        <button type="reset" class="btn btn-reset" accesskey="r">Reset</button>
    </div>

</form>
</body>
</html>
